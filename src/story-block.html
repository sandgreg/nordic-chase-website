<section class="nc-story" aria-label="The route, chapter by chapter">
<style>
  .nc-story {
    --nc-olive: #2E3104; --nc-sage: #B8BC80; --nc-lime: #D6FF3F; --nc-pale: #FFFDC1; --nc-cream: #FEFFE9;
    --nc-top: 0px;            /* height of a fixed site header, set by the script */
    --nc-map-h: calc(100vh - var(--nc-top) - 48px);
    background: var(--nc-olive); color: var(--nc-cream);
    font-family: "Schibsted Grotesk", -apple-system, "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box; width: 100vw; position: relative; left: 50%; margin-left: -50vw;
    padding: clamp(40px, 6vw, 88px) clamp(16px, 4vw, 48px);
  }
  .nc-story * { box-sizing: border-box; font-family: inherit; }
  .nc-story .nc-story-head { max-width: 1320px; margin: 0 auto clamp(24px, 4vw, 48px); }
  .nc-story h2 { margin: 0; font-size: clamp(34px, 6vw, 76px); font-weight: 800; line-height: .95; letter-spacing: -.02em;
    text-transform: uppercase; color: var(--nc-cream); }
  .nc-story .nc-story-sub { margin: 12px 0 0; font-size: clamp(16px, 1.6vw, 19px); color: var(--nc-sage); }
  .nc-story .nc-story-grid { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    gap: clamp(20px, 3vw, 48px); align-items: stretch; }
  .nc-story .nc-story-mapcol { position: relative; }
  .nc-story .nc-story-map { position: sticky; top: calc(var(--nc-top) + 24px); height: var(--nc-map-h); min-height: 420px;
    border-radius: 6px; overflow: hidden; background: #0e1013; }
  .nc-story.nc-js-pin .nc-story-map { position: relative; top: 0; will-change: transform; }
  .nc-story .nc-story-map iframe { display: block; width: 100%; height: 100%; border: 0; }
  .nc-story .nc-story-cards { display: flex; flex-direction: column; gap: 32vh; padding: 12vh 0 40vh; }
  .nc-story .nc-story-card { background: var(--nc-pale); color: var(--nc-olive); border-radius: 6px;
    padding: clamp(20px, 2.4vw, 32px); border-left: 8px solid transparent; opacity: .55; transition: opacity .35s, border-color .35s; }
  .nc-story .nc-story-card.is-active { opacity: 1; border-left-color: var(--nc-lime); }
  .nc-story .nc-story-no { margin: 0 0 4px; font-size: 14px; font-weight: 700; color: #6b6f2c; }
  .nc-story h3 { margin: 0; font-size: clamp(22px, 2.3vw, 30px); font-weight: 800; line-height: 1.05; letter-spacing: -.01em;
    text-transform: uppercase; color: var(--nc-olive); }
  .nc-story .nc-story-km { margin: 10px 0 14px; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--nc-olive); }
  .nc-story .nc-story-text { margin: 0; font-size: 17px; line-height: 1.55; max-width: 60ch; color: var(--nc-olive); }
  .nc-story .nc-story-lm { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .nc-story .nc-story-lm:empty { display: none; }
  .nc-story .nc-story-lm li { margin: 0; padding: 5px 10px; font-size: 13px; font-weight: 600; line-height: 1.2;
    border: 1.5px solid var(--nc-sage); border-radius: 999px; color: var(--nc-olive); }
  .nc-story .nc-story-lm li b { font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .nc-story .nc-story-card { transition: none; } }

  /* phone: map pinned across the top, cards scroll underneath */
  @media (max-width: 820px) {
    .nc-story { --nc-map-h: 48vh; padding-left: 0; padding-right: 0; }
    .nc-story .nc-story-head { padding: 0 16px; }
    .nc-story .nc-story-grid { grid-template-columns: 1fr; gap: 0; }
    .nc-story .nc-story-mapcol { position: sticky; top: var(--nc-top); z-index: 2; height: auto; }
    .nc-story.nc-js-pin .nc-story-mapcol { position: relative; top: 0; }
    .nc-story .nc-story-map { position: relative; top: 0; min-height: 0; border-radius: 0; }
    .nc-story .nc-story-cards { gap: 22vh; padding: 6vh 16px 30vh; }
    .nc-story .nc-story-text { font-size: 16px; }
  }
</style>
<div class="nc-story-head">
  <h2>The route</h2>
  <p class="nc-story-sub">{{name}}, chapter by chapter.</p>
</div>
<div class="nc-story-grid">
  <div class="nc-story-mapcol">
    <div class="nc-story-map">
      <iframe src="{{map_src}}" title="Route map: {{name}}" loading="lazy" allowfullscreen></iframe>
    </div>
  </div>
  <div class="nc-story-cards">
{{cards}}
  </div>
</div>
<script type="application/json" class="nc-data">{{data}}</script>
<script>
(function () {
  var root = document.currentScript.closest('.nc-story');
  var D = JSON.parse(root.querySelector('.nc-data').textContent);
  var frame = root.querySelector('iframe');
  var cards = Array.prototype.slice.call(root.querySelectorAll('.nc-story-card'));
  var mapcol = root.querySelector('.nc-story-mapcol');
  var mapbox = root.querySelector('.nc-story-map');
  var mapOrigin = new URL(frame.src, location.href).origin;
  var edition = D.editions[0];
  var active = -1, mapReady = false;

  function send(msg) { if (mapReady && frame.contentWindow) frame.contentWindow.postMessage(msg, mapOrigin); }

  // landmarks inside a chapter, for the current edition
  function landmarksFor(i) {
    var r = D.chapters[i].km[edition]; if (!r) return [];
    return D.landmarks.filter(function (l) {
      var km = l.km[edition];
      return km !== null && km !== undefined && (km > r[0] || (i === 0 && km >= r[0])) && km <= r[1];
    }).map(function (l) { return { name: l.name, km: l.km[edition] }; });
  }
  function renderCards() {
    cards.forEach(function (card, i) {
      var km = card.querySelector('.nc-story-km');
      km.textContent = km.dataset[edition] || '';
      var ul = card.querySelector('.nc-story-lm'); ul.innerHTML = '';
      landmarksFor(i).forEach(function (l) {
        var li = document.createElement('li'); li.textContent = l.name + ' '; var b = document.createElement('b');
        b.textContent = 'km ' + l.km; li.appendChild(b); ul.appendChild(li);
      });
    });
  }
  function showChapter(i) {
    var r = D.chapters[i].km[edition]; if (!r) return;
    send({ type: 'nc:landmarks', items: landmarksFor(i) });
    send({ type: 'nc:goto', km: r[0], toKm: r[1] });
  }
  function setActive(i) {
    if (i === active) return;
    active = i;
    cards.forEach(function (c, j) { c.classList.toggle('is-active', j === i); });
    showChapter(i);
  }

  // which chapter is being read: the last card whose top has passed the reading line
  function readingLine() {
    var narrow = window.matchMedia('(max-width: 820px)').matches;
    var top = parseFloat(getComputedStyle(root).getPropertyValue('--nc-top')) || 0;
    return narrow ? top + mapbox.offsetHeight + (window.innerHeight - top - mapbox.offsetHeight) * 0.35 : window.innerHeight * 0.5;
  }
  function pick() {
    var line = readingLine(), i = 0;
    cards.forEach(function (c, j) { if (c.getBoundingClientRect().top <= line) i = j; });
    setActive(i);
  }

  // fixed site header (Squarespace): keep the pinned map below it
  function headerOffset() {
    var h = document.querySelector('#header, header.header, .header');
    if (!h) return 0;
    var pos = getComputedStyle(h).position;
    return (pos === 'fixed' || pos === 'sticky') ? h.getBoundingClientRect().height : 0;
  }

  // position: sticky stops working if a parent has overflow set (some Squarespace wrappers do).
  // Then the map is pinned with a transform instead.
  function clips(el) { var cs = getComputedStyle(el); return /(hidden|auto|scroll)/.test(cs.overflowX + ' ' + cs.overflowY); }
  function stickyBroken() {
    for (var el = root.parentElement; el && el !== document.body; el = el.parentElement) if (clips(el)) return true;
    // body only becomes its own scroll box (and breaks sticky) when html sets overflow too
    return clips(document.body) && clips(document.documentElement);
  }
  var jsPin = false;
  function pinByScript() {
    if (!jsPin) return;
    var narrow = window.matchMedia('(max-width: 820px)').matches;
    var target = narrow ? mapcol : mapbox;
    var host = narrow ? root.querySelector('.nc-story-grid') : mapcol;
    var top = (parseFloat(getComputedStyle(root).getPropertyValue('--nc-top')) || 0) + (narrow ? 0 : 24);
    var rect = host.getBoundingClientRect();
    var y = Math.max(0, Math.min(top - rect.top, rect.height - target.offsetHeight));
    target.style.transform = 'translateY(' + y + 'px)';
  }

  var ticking = false;
  function onScroll() {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () { ticking = false; pinByScript(); pick(); });
  }
  function layout() {
    root.style.setProperty('--nc-top', headerOffset() + 'px');
    jsPin = stickyBroken();
    root.classList.toggle('nc-js-pin', jsPin);
    if (!jsPin) { mapcol.style.transform = ''; mapbox.style.transform = ''; }
    onScroll();
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== mapOrigin || e.source !== frame.contentWindow || !e.data || e.data.type !== 'nc:ready') return;
    mapReady = true;
    send({ type: 'nc:edition', edition: edition });
    if (active >= 0) showChapter(active);
  });
  document.addEventListener('nc:edition', function (e) {
    var next = e.detail && e.detail.edition;
    if (!next || next === edition || D.editions.indexOf(next) < 0) return;
    edition = next;
    renderCards();
    send({ type: 'nc:edition', edition: edition });
    if (active >= 0) showChapter(active);
  });
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', layout);
  renderCards();
  layout();
  if (active < 0) setActive(0);
})();
</script>
</section>
